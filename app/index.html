<script src="vendor/ts-fsrs.umd.js"></script>
<script type="module">
  // 转换程序比较大（约 18MB），只有在导入时才下载
  window.createConverter = (opts) => {
    let real = null;
    const load = () => real || (real = import('./convert/kepan-convert.js').then((m) => m.createConverter(opts)));
    const wrap = (fn) => async (...a) => (await load())[fn](...a);
    return { ready: wrap('ready'), kepanFromPdf: wrap('kepanFromPdf'), shiyiFromEpub: wrap('shiyiFromEpub'), applyFixes: wrap('applyFixes') };
  };
</script>
<script src="app.js"></script>
