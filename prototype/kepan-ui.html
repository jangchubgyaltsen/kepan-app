<script>

function hsh(i){i=(i*2654435761)>>>0;return (i>>>13)%97}
function verseMaskHTML(stanzas,r){let ci=0;return `<div class="verse vm">${stanzas.map(s=>{const ph=s.match(/[^，。！？：]+[，。！？：]/g)||[s];const lines=[];
 const P=x=>{let out="";[...x].forEach((ch,j)=>{const pun=/[，。！？：；、]/.test(ch);const k=ci++;let m=false;if(!pun){if(r===1)m=hsh(k)%3===0;else if(r===2)m=hsh(k)%3!==0;else if(r>=3)m=j>0}out+=m?`<span class="mk">${esc(ch)}</span>`:esc(ch)});return out};
 for(let i=0;i<ph.length;i+=2)lines.push(ph.slice(i,i+2).map(x=>`<span class="ph">${P(x)}</span>`).join(""));
 return lines.map(l=>`<span class="ln">${l}</span>`).join("")}).join('<span class="ln" style="height:.5em"></span>')}</div>`}
const RND=["通读","遮三分之一","遮三分之二","只留首字"],RNDC=["通读","下半首自己接","只给第一句","只给第一个字"];
const SHIYI={"p1":{"n0":[["v","暇满人身极难得，既得能办人生利，",0],["v","倘若今生利未办，后世怎得此圆满。",0],["p","如云：“地狱饿鬼与旁生，边鄙以及长寿天，邪见佛陀不出世，喑哑此等八无暇。”断除了这其中所说的八种无暇，因而称为闲暇。如云：“为人根足生中土，业际无倒信佛法，佛出世间与说法，法住入教有施主。”身为具足男根或女根的人；转生于地界中土；眼等诸根完整无缺；断除五无间罪因而使业际无有颠倒；对如来的律法有信心因而称为信佛法。这以上是五种自圆满。"],["p","佛陀现身于世；宣说佛法；因为有见谛的补特伽罗而使佛法得以住世；根据圣者的证悟而开示教言令有缘者趋入佛门；有提供资具的施主，这是指为利他众的慈悲。这五种是他圆满。"],["p","由于具足以上十种特点，所以称为圆满。具足十八种功德的这一身体实在是极为难得。《华严经·佛暖处传》中云：“遣除八种无暇亦难得，清净圆满闲暇亦难得。”这般暇满的士夫具有成办增上生与决定胜的能力。在已经获得了暇满人身的此时此刻我们务必要勤勤恳恳、兢兢业业奉行善法。假设在这个时候没有修持有利于自他的善法，那么后世怎么能再度得到这样清净圆满的暇满人身？绝对不会得到。因此，作者教诫我们，万万不可白白浪费、虚度人生。如经中说：“莫令如此闲暇无意义。”《致弟子书》中也说：“何者得已越至生海岸，播下殊胜菩提善种子，功德亦胜如意之宝珠，如是人身谁令空无果？”"]],"n1":[["v","犹如乌云暗夜中，刹那闪电极明亮，",0],["v","如是因佛威德力，世人暂萌修福意。",0],["p","例如：在乌云密布的漆黑夜晚，偶尔依靠闪电的外缘一瞬间能使色法昭彰显著，现得极为明显。同样，借助佛陀的威德力，有时候也能使由罪业所感处在痛苦黑暗中的所有世人偶尔萌生行善修福的智慧，而这种心态不会屡屡持久不断地生起，因而我们一定要努力生起、增上奉行善法的心念。如云：“具备闲暇圆满之双翼，亦具现见善恶功过目，然被贪图名利网所擒，岂非已入罪业之笼中？”"]],"n3":[["v","以是善行恒微弱，罪恶力大极难挡，",0],["v","舍此圆满菩提心，何有余善能胜彼。",0],["p","所依人身与意乐既难得又短暂，因此善法的对治也就显得十分可怜，换句话说，这种对治的善行时时刻刻都是力量微薄弱小而存在。相反，一切不善业的因缘聚合起来却非常容易，致使罪恶的力量格外强大、势不可挡，难以想象，而且接连不断产生。由此可见，现在我们就必须要具备能摧毁罪业的善法。对于弥天大罪，除了圆满智悲自性的菩提心以外，有什么其他善法能遣除得了？根本无法遣除。所以我们一定要发起菩提心。《华严经》中云：“猫眼见即能震慑诸鼠，令其无法堪忍。同理，遍知之心（指菩提心）宝明目亦能制伏一切业惑之鼠，令其无法堪忍。”"]],"n4":[["v","佛于多劫深思维，见此觉心最饶益，",0],["v","无量众生依于此，顺利能获最胜乐。",0],["p","诸位佛陀在三大阿僧祇劫中深深思维、再再观察利益众生的方便，结果发现这颗菩提心是对众生最为有利，因为依靠这一菩提心，无量众生能轻而易举获得无上菩提的殊胜安乐。"]],"n5":[["v","欲灭三有百般苦，及除有情众不安，",0],["v","欲享百种快乐者，恒常莫舍菩提心。",0],["p","想要摧毁自己在三有中的千万痛苦、想要遣除其他一切有情的所有不幸、想要使自他群生普享百千快乐的人恒时也不要舍弃菩提心，因为依靠它必定能实现这些目标。"]],"n6":[["v","生死狱系苦有情，倘若生起菩提心，",0],["v","即刻得名诸佛子，世间人天应礼敬。",0],["p","在轮回的牢狱中被业与烦恼紧紧束缚的苦难众生，如果能生起菩提心，那么瞬间也就是说从此以后，名称上可以堪称一切如来之子，从意义上来说，成为人天世间的应礼处。"]],"n7":[["v","犹如最胜冶金料，垢身得此将转成，",0],["v","无价之宝佛陀身，故应坚持菩提心。",0],["p","就像是依靠最上等的冶金原料（普通金属也能变成金子）一样，不清净的这个身体依靠得受菩提心可以转变成无价之宝的佛陀身，因而我们一定要坚持不懈稳固受持具有这种能力的菩提心。《华严经》中云：“以一两水银类之金能使千两铁变成金为喻，如是发心水银界善根以普皆回向遍知之智所摄持，即能灭尽一切业惑障之铁物，诸法亦成遍知之妙色，然而一切业惑之铁不能灭尽为一切智智而发菩提心之金。”"]],"n8":[["v","众生导师以慧观，彻见彼心极珍贵，",0],["v","诸欲出离三界者，宜善坚持菩提心。",0],["p","能将一切众生带到解脱城享受功德宝珠的唯一商主就是无与伦比的佛陀，佛智周遍所知万法，除此之外其他众生无法衡量，佛陀以无量的智慧认真全面观察诸法时，彻底照见此菩提心最为难得，功德巨大，弥足珍贵。《华严经》中云：“诸宝之中如意宝堪为宝王，同理三世中遍知智慧照见法界对境，诸人天与诸声闻缘觉之有漏无漏善根皆不及发菩提心如意宝王之价。”因此，想要远离痛苦的所有众生理当坚定不移善加受持菩提心。"]],"n9":[["v","其余善行如芭蕉，果实生已终枯槁，",0],["v","菩提心树恒生果，非仅不尽反增茂。",0],["p","没有被菩提心摄持的其他所有善根如同芭蕉树一般生果以后自然穷尽，而菩提心的妙树恒常都会生长果实，非但不会穷尽，反而会蒸蒸日上。《宝箧经》中云：“文殊，各种树以四大摄持而增长。文殊，如是善根若以菩提心摄持、回向佛果，则日益增长。”"]],"n10":[["v","如人虽犯极重罪，然依勇士得除畏，",0],["v","若有速令解脱者，畏罪之人何不依。",0],["p","即便是造了危害三宝等不堪设想的弥天大罪，然而就像依靠一位护送者的勇士能够摆脱怨敌的严重威胁一样，对于顷刻间就能脱离重罪异熟果的菩提心，小心谨慎罪业的人们为什么不依靠呢？理应依靠。《无尽慧经》中云：“善男子，譬如依勇士可不惧诸怨敌，同理，依真实菩提心勇士之菩萨不畏一切罪行怨敌。”"]],"n11":[["v","菩提心如末劫火，刹那能毁诸重罪。",0],["p","末劫火能将一禅天以下的器世界焚毁无余，同样，依靠菩提心一刹那间必定能从根本上焚毁五无间罪等一切深重罪业。《华严经》中云：“能焚诸恶行如末劫火。”"],["p","善天尊者说：“一刹那之大安忍不缘所取，所以必定能焚烧（罪业）。”其实，这种讲法与前面所说的道理并不重复，前面是指压制罪业，这里是说从根本上摧毁。"],["p","如果有人问：那么，一颗菩提心具备这二种功德难道不矛盾吗？"],["p","并不矛盾。如果获得了越来越殊胜的菩提心，那么功德也会越来越超胜，是从循序渐进而获得来讲的。"]],"n12":[["v","智者弥勒谕善财，彼心利益无限量。",0],["p","此外，拥有高超智慧的弥勒怙主对善财童子说：此菩提心的功德无法估量。《华严经》中记载：“乐源城中商主坚财之子善财童子，于文殊前发心后，为了寻觅菩萨学处而逐渐前行。尔时，至尊弥勒正在南方海滨由毗卢遮那佛严饰具藏楼阁之一方，为如海菩萨眷属讲经说法。善财童子见此情景，急忙顶礼。弥勒菩萨向诸眷属赞颂善财童子言：‘且看意乐清净者，坚财之子名善财，寻求殊胜菩提行，来至智者我面前。’随之对善财言：‘善来善来慈悲汝，善来弥勒坛城中，善来寂静调柔尊，苦行之时疲倦否？’善财童子恭敬请问：‘圣者，我真实趋入无上菩提正道时，不知该如何励力学修菩萨学处，请您明示。’弥勒菩萨答言：‘善男子，你已为善知识所摄受。何以故？善男子，菩提心乃诸佛法之根本，犹如种子；可令一切众生善法增上，犹如良田；一切有情赖以生存，故如大地；能真正杜绝一切贫困，故如多闻天子；能圆满护持一切菩萨，故如父亲；能真实成办诸事，故如摩尼宝王；能满足一切心愿，故如妙瓶；……菩提心具有此等及其余千百万无量无边利益……’”其中有详细叙述。"]],"n15":[["v","略摄菩提心，当知有二种，",0],["v","愿求菩提心，趣行菩提心。",0],["p","我们一定要明确，归纳起来菩提心有两种，也就是愿菩提心与行菩提心。如《华严经》中说：“任何众生为无上菩提而发愿亦稀罕，与之相比，为无上菩提而行持更为稀罕。”"]],"n16":[["v","如人尽了知，欲行正行别，",0],["v","如是智者知：二心次第别。",0],["p","就像想要去往某地一样，为了他利而想获得菩提的意乐，即是愿菩提心；如同正式启程前往该地一般，踏上能获得佛果的正道并且渴望修持此道，就是行菩提心。希望成办自他二利的智者，通过了知这两种比喻的差别，同时就会明白愿行两种菩提心意义的不同顺序。"]],"n17":[["v","愿心于生死，虽生广大果，",0],["v","犹不如行心，相续增福德。",0],["v","何时为度尽，无边众有情，",1],["v","立志不退转，受持此行心，",1],["v","即自彼时起，纵眠或放逸，",2],["v","福德相续生，量多等虚空。",2],["p","愿菩提心在我们身处生死轮回期间，可以产生广大的果报，《华严经》中云：“善男子，譬如金刚宝纵然坏损，亦胜过所有上等金饰，且不失金刚宝之名。善男子，同理，发菩提心之金刚宝纵然离开勤奋亦胜过一切声闻缘觉功德之金饰，亦不失菩萨之名，复能遣除轮回之一切贫困。”然而，它并不是像行菩提心那样接连不断产生福德。从什么时候起，为了能使无边无际所有众生界从业惑的束缚与轮回的牢狱中解脱出来，在生死轮回没有空无之前，怀着义无反顾的利他心真实受持行菩提心，自此以后如果没有失毁这一行菩提心，那么即便处在睡眠或陶醉等放逸的状态中，齐天洪福也会连续不断屡屡产生。"]],"n20":[["v","为信小乘者，妙臂问经中，",0],["v","如来自宣说，其益极应理。",0],["p","行菩提心能产生众多福德这一点具有合理性，确凿可靠的依据是《妙臂请问经》，为使信解小乘之所有众生趋入大乘，佛陀在此经中云：“设若我为利乐无边众生而披上盔甲，则利乐一切有情之所缘无边，善根亦无边故，即使放逸或睡眠，然于昼夜心之每刹那，善根亦增长、强盛、圆满。”"]],"n21":[["v","若仅思疗愈，有情诸头疾，",0],["v","具此饶益心，获福无穷尽，",0],["v","况欲除有情，无量不安乐，",1],["v","乃至欲成就，有情无量德。",1],["p","某人怀着一颗慈悲的心肠，仅仅想用药物等治愈少数众生的头痛脑热等，就证明他具有一颗饶益心，也能获得无量福德。对此，有些论师是结合匝哦之女的公案进行讲解的。作为观想所缘境的一切众生而希望消除每一位有情的无量痛苦、渴求使每一位有情具足无量安乐的人，能获得无量福德当然就更不言而喻了。"]],"n22":[["v","是父抑或母，谁具此心耶？",0],["v","是仙或欲天，梵天有此耶？",0],["v","彼等为自利，尚且未梦及，",1],["v","况为他有情，生此饶益心？",1],["v","他人为自利，尚且未能发，",2],["v","珍贵此愿心，能生诚稀有！",2],["p","不管是父亲还是母亲，在诸位亲朋友人当中，有谁会具备这样的利益之心呢？根本没有。就算是天人、仙人或者梵天具有这样的心吗？他们也同样不具有。如《经观庄严论》中云：“犹如佛子具利心，于此成熟诸有情，如是父母诸亲友，子与至亲不具备24。”这些众生以前为了自身的利益，甚至在梦中也没有出现过这样的心，又怎么可能为他众的利益而真正萌生呢？因此说，其他众生尚且为了一己私利，也从来没有生起过一心一意为众生利益着想的这一珍宝菩提心，前所未有能够生起实在是难能可贵、稀有罕见。"]],"n24":[["v","珍贵菩提心，众生安乐因，",0],["v","除苦妙甘霖，其福何能量？",0],["p","堪为一切众生安乐之因、遣除有情痛苦重疾之妙药的珍宝菩提心，她的福德怎么能衡量得出来呢？《吉祥施请问经》中云：“菩提心福德，倘若有形色，遍满虚空界，亦将超胜彼。”"],["v","仅思利众生，福胜供诸佛，",1],["v","何况勤精进，利乐诸有情。",1],["p","仅仅思维利益众生也胜过供养佛陀，将精力投放在成办一切有情安乐的事业上，更为超胜也就不必说了。《三摩地王经》中云：“俱胝那由他刹土，所有无量诸供品，恒时以此供圣士，不及慈心之一分。”"]],"n25":[["v","众生欲除苦，反行痛苦因，",0],["v","愚人虽求乐，毁乐如灭仇。",0],["v","于诸乏乐者，多苦诸众生，",1],["v","足以众安乐，断彼一切苦，",1],["v","更复尽其痴，宁有等此善！",2],["v","安得似此友！岂有如此福！",2],["p","作为众生，尽管有想丢弃痛苦的心念，可是由于茫然不知痛苦之因是不善业，反而屡屡奔波造罪；虽然也想得到快乐，却全然不晓得乐的方法，以这样的无明愚痴而弃离善业，结果将自己的安乐像怨敌一样毁灭。对于乏少安乐、多具痛苦的这些众生，怀着大慈心用一切快乐来满足他们，以大悲心解除他们的所有痛苦，以大智慧遣除他们对苦乐之因一无所知的愚痴，哪有能与此相提并论的善业？哪有能这般利济帮助的亲友？哪有能依之生起如此福德的事呢？"]],"n29":[["v","若人酬恩施，尚且应称赞，",0],["v","何况未受托，菩萨自乐为。",0],["p","任何人有感恩图报之心，尚且值得被人们称赞是“这是知恩报恩的人”，更何况说没有受人嘱托也是心甘情愿地利乐众生的菩萨了。"]],"n30":[["v","偶备微劣食，嗟施少众生，",0],["v","令得半日饱，人敬为善士，",0],["v","何况恒施予，无边有情众，",1],["v","善逝无上乐，满彼一切愿。",1],["p","比方说，有人进行布施，他所舍施的对境仅仅是少量的众生，时间也只是一年一月施舍一次，所布施的物品也是平平常常的食物，而且态度也是不屑一顾、极不恭敬，所行的利益也只是解决对方半日内充饥饱腹的食品。如此之举尚且被人们称为善行而受到众人恭敬，更何况说对境是无量无数的有情，时间是漫漫无期连续不断，所施的事物也是善逝的无上安乐，所行的利益也是满足一切愿望，行为上也是以毕恭毕敬的方式施予。"],["p","所谓的“恒”字，有的注释中解释为“纵然虚空、众生到了尽头也不终止”；慧源尊者是按照时间的差别而讲的；善天尊者则按照施物的差别来解释的。"]],"n31":[["v","博施诸佛子，若人生恶心，",0],["v","佛言彼堕狱，长如心数劫。",0],["v","若人生净信，得果较前胜。",1],["p","假设任何众生对这样慷慨博施的施主菩萨生起恶心，那么他生起了多少刹那的恶念，就要在这么多劫中沉陷地狱。《寂静定幻经》中云：“文殊，菩萨对菩萨生嗔轻侮，则等同此心之劫中住于地狱而披盔甲。”相反，如果任何众生对具有菩提心的菩萨生起清净的信心，那么它的果报已经远远胜过恶心的果报。《趋入定不定手印经》中云：“文殊，设若十方所有世间界诸众生之眼被挖出，设若有善男子善女人以慈心令彼等众生之目复明。文殊，若有其他善男子善女人以信心目视信解大乘之菩萨，则所生福德已胜前者无量倍。”"]],"n32":[["v","佛子虽逢难，善增罪不生。",0],["p","一切佛子即便遭受再大的痛苦与磨难，也绝不会生起嗔恨等恶心，反而会依靠这种外缘力使善法自然增上。如《般若摄颂》中云：“虽受数多难忍害，然彼胜士心不变，安忍之力极稳故，多信解修胜菩提。”"]],"n33":[["v","何人生此心，我礼彼人身，",0],["v","加害结乐缘，皈依乐源尊。",0],["p","诚如《宝积经》中云：“譬如大国王，生有具相子，见童子诞生，城人小国聚，自生菩提心，成具相太子，天等世间礼，净心尊重彼。”任何人生起了珍宝菩提心，作者即对他的身体恭敬顶礼。就算是有人对他加害，也会令作害者与安乐连在一起，因而我们在堪为一切众生安乐之源泉的菩萨面前虔诚皈依。"],["p","如果有人问：此处的说法不是与“博施诸佛子，若人生恶心，佛言彼堕狱，长如心数劫”相违了吗？"],["p","答：并不相违。上句颂词是说明恶心的果报，而此处的意思是说菩萨暂时与究竟摄受作害者，就像慈力王暂时、究竟使五位罗刹拥有安乐一样。"],["g","不见尽遣二障暗，菩提心宝之日轮，"],["g","坠于愚痴黑暗中，睁常断眼诚可悲！"],["n","24 唐译：利子及利亲，利己三利胜，菩萨利一切，过彼胜无比。"]]},"p2":{"n40":[["v","罪业未净前，吾身或先亡，",0],["v","云何脱此罪，故祈速救护！",0],["p","为什么要精勤忏悔呢？在罪业还没有得以清净之前，我很有可能会先死去，倘若如此，就会堕落到恶趣当中，到那时如何能摆脱这些罪业呢？因此祈求迅速得以救护！"]],"n41":[["v","死神不足信，不待罪净否，",0],["v","无论病未病，寿暂不可恃。",0],["p","这么急迫皈依到底是什么原因呢？不可信赖的这个死亡不会等到你罪业清净与否，也不会照顾你事情完没完成，不管你生病还是没有生病，都不能保证不会突然气绝身亡，寿命实在是不可靠。"],["v","因吾不了知，死时舍一切，",1],["v","故为亲与仇，造种种罪业。",1],["p","人在死亡的时候必然要抛下亲友怨敌等一切的一切，只剩下自己孤孤单单，可是我由于没有认识到这一点而为利亲害怨造下了各种罪业。"]],"n42":[["v","仇敌化虚无，诸亲亦烟灭，",0],["v","吾身必死亡，一切终归无。",0],["p","依之造罪的怨敌们如今已经不复存在，亲友们也已杳无踪影，我也不会例外，终究难免一死，有情与受用一切的一切最终都将化为乌有，为了这一切而造罪实在是无有意义。"],["v","人生如梦幻，无论何事物，",1],["v","受已成念境，往事不复见。",1],["p","假设有人心里认为：使亲友们欢欣喜悦等快乐以后也会跟随着我们，所以有实在的意义。"],["p","实际上这样的快乐等何事何物、现在所有的受用等一切的一切后来只能成为回忆的对境罢了，而不可能再亲眼目睹、亲身感受，因为往事已经流逝过去，犹如梦中所享受的快乐在醒来时荡然无存一般。"],["v","复次于此生，亲仇半已逝，",2],["v","造罪苦果报，点滴候在前。",2],["p","不用说是流转的生生世世，就是暂时存活的今生今世当中也可以看得出，多半过世的亲朋好友、冤家对头以及曾经与之相伴的快乐等都如梦境一样一去不复返，然而为了他们所造的难以饶恕的罪业及所有习气果报却都在前方等候着我们。"]],"n43":[["v","因吾不甚解：命终如是骤，",0],["v","故起贪嗔痴，造作诸恶业。",0],["p","由于我没有深刻地认识到死亡如此突然，导致受贪嗔痴的牵制而造下了许许多多罪业，要想使这些罪业在即生中得以清净，就必须雷厉风行加以净除。"],["v","昼夜不暂留，此生恒衰减，",1],["v","额外无复增，吾命岂不亡？",1],["p","朝夕流逝，片刻不停，今生稍纵即逝，一分一秒地减少，而绝不会有增多的可能，为此，我又怎么会不死呢？定死无疑。"]],"n45":[["v","临终弥留际，众亲虽围绕，",0],["v","命绝诸苦痛，唯吾一人受。",0],["p","有人认为：尽管必死无疑，但是在死的时候还是需要亲友等。"],["p","在临终的弥留之际，自己躺在床榻上，尽管所有亲友在四周团团围绕，可是命绝身亡的苦痛只有我独自一人感受，他们根本无法分担。"],["v","魔使来执时，亲朋有何益？",1],["v","唯福能救护，然我未曾修。",1],["p","如果有人认为：即便如此，但他们在那时也能救护我吧。"],["p","当你被阎罗狱卒捉住时，亲戚朋友们能起到什么作用呢？根本无济于事。那么，什么才能对你有帮助呢？到那个时候，唯有福德才能救护，然而遗憾的是，我却从来没有修善积福。"],["v","放逸我未知：死亡如是怖，",2],["v","故为无常身，亲造诸多罪。",2],["p","于是不由得悲哀大声呼喊：怙主啊！没有修善积福、没有防护漏法而一直放逸无度的我不知道死亡竟然这般恐怖，以至于为了无常的现世亲身造下了累累罪业。"]],"n46":[["v","若今赴刑场，罪犯犹惊怖，",0],["v","口干眼凸出，形貌异故昔。",0],["v","何况形恐怖，魔使所执持，",1],["v","大怖忧苦缠，苦极不待言。",1],["p","例如，一名今天就要被带到刑场上去的罪犯，也会惊恐万分，口干舌燥，双目凸出，面目皆非，与以前判若两人，那么被面目狰狞、十分可怕的阎罗狱卒捉住，被极大的恐惧所逼，处在痛苦不堪、极为可怜的地步，那副胆战心惊的悲惨情景就更不用说了。"],["v","谁能救护我，离此大怖畏，",2],["v","睁大凸怖眼，四方寻救护，",2],["v","四方遍寻觅，无依心懊丧，",3],["v","彼处苦无依，惶惶何所从？",3],["p","到那时，有谁能救护我摆脱这么巨大的恐怖呢？我不由得睁大向外凸出、惶恐不安的双眼四处寻觅救护者，经过一番苦苦寻找，结果发现四方居然没有任何可皈依处，不禁心灰意冷，极度失望。如果处在那种无依无靠的境地中，当时我该何去何从呢？实在是无计可施。"]],"n50":[["v","佛为众怙主，慈悲勤护生，",0],["v","力能除众惧，故我今皈依。",0],["v","如是亦皈依，能除轮回怖，",1],["v","我佛所悟法，及菩萨圣众。",1],["p","当时，无依无靠，唯有皈依三宝，众生怙主、大慈大悲的佛陀以最大的精进行持救护一切有情的事业，具有超凡的救护威德力，能遣除所有怖畏，因此我从现在起皈依佛陀；皈依能解除轮回恐怖、佛陀所了悟的正法；同样也真实皈依菩萨僧众。"]],"n51":[["v","因怖惊颤栗，将身奉普贤，",0],["v","亦复以此身，敬献文殊尊。",0],["p","我由于害怕地狱等处的痛苦而惊恐不安、瑟瑟发抖，于是将自己奉献给普贤大菩萨，也将自己的身体献给文殊菩萨。"],["v","哀号力呼求，不昧大悲行，",1],["v","慈尊观世音，救赎罪人我！",1],["p","痛苦不堪的我悲哀哭泣，极力呼唤具有无伪大悲心与大悲行的怙主观世音菩萨，为什么呢？祈求救护罪大恶极的我。"],["v","复于虚空藏，及地藏王等，",2],["v","一切大悲尊，由衷祈救护。",2],["p","也同样发自内心地呼唤圣者虚空藏菩萨、地藏王菩萨、弥勒菩萨、除盖障菩萨等具有大悲心的所有怙主，祈愿能得到他们的救护。"],["v","皈依金刚手，怀嗔阎魔使，",3],["v","见彼心畏惧，四方速逃逸。",3],["p","我也皈依能令那些嗔恨众生的阎罗狱卒等见而生畏、四处逃窜的金刚手菩萨。"]],"n53":[["v","昔违尊圣教，今生大忧惧。",0],["v","愿以皈命尊，求速除怖畏！",0],["p","如今深深察觉到，昔日违越佛陀教的罪业果报如此可怕，而皈依您祈求迅速消除恐怖。"]]}};

let SS=null;
function buildQueue(){const rev=[];Object.values(BOOKS).forEach(B=>rev.push(...dueList(B)));const q=shuffle(rev,rev.length*7+3);
 if(rev.length<=20){for(const B of Object.values(BOOKS)){const n=newNode(B);if(n){const miss=stepsOf(n).filter(k=>!itm(n,k));["exp","mask","loc"].filter(k=>miss.includes(k)).forEach(k=>q.push({n,k,B,isNew:true}));break}}}
 return q}
function pickDaily(){const L=[];Object.values(BOOKS).forEach(B=>B.seq.forEach(n=>{if(n.v.length&&itm(n,"loc"))L.push({n,B})}));const d=new Date();const x=L[(d.getDate()*7+d.getMonth())%L.length];return {n:x.n,B:x.B,k:"loc",isNew:false,daily:true}}
function initTask(t){if(!t)return null;const n=t.n;
 if(t.k==="loc"){const L=leavesOf(n);const leaf=n.v.length?n:L[(n.id.length*3+L.length)%L.length];const path=[...anc(n),n];let lay=0;while(lay<path.length-1&&path[lay].p.c.length===1)lay++;
  return {kind:"loc",leaf,path,lay,auto:lay,bad:{},wrong:0,done:false,chances:t.daily?5:null}}
 if(t.k==="exp"){let dis=[];if(!t.isNew){const pool=t.B.all.filter(x=>x.lvl===n.lvl+1&&x.p!==n);const i0=t.B.all.indexOf(n);pool.sort((a,b)=>Math.abs(t.B.all.indexOf(a)-i0)-Math.abs(t.B.all.indexOf(b)-i0));dis=pool.slice(0,n.c.length>2?2:1).map(x=>x.id)}
  return {kind:"exp",order:shuffle([...n.c.map(x=>x.id),...dis],n.c.length*13+dis.length),dis:new Set(dis),placed:[],wrong:0,shake:null,done:false}}
 return {kind:"mask",r:t.isNew?0:3,peek:false,wrong:false,done:false}}
function dayMark(){if(!SR.today)SR.today={n:0,dedi:false};if(!SR.today.n)SR.streak++;SR.today.n++}
function dediMaybe(){}
function grade(t,ok){dayMark();if(t.daily){SR.daily={done:true,ok,used:5-SS.t.chances};return}const key=t.n.id+"|"+t.k;const o=SR.it[key];const was=!!o;let lv;
 if(t.isNew||!o)lv=0;else lv=ok?Math.min(5,o.lv+1):Math.max(0,o.lv-2);SR.it[key]={lv,due:ok||!o?INTV[lv]:1};if(t.isNew&&t.k==="mask")SR.wkNew+=t.n.v.length;SS.res.push({t,ok,first:!was,lv});if(!ok&&!t.again)SS.q.push({...t,isNew:false,again:true})}
function startSession(opt){SS={q:opt&&opt.daily?[opt.daily]:buildQueue(),i:0,res:[],daily:!!(opt&&opt.daily),from:ST.screen==="study"?"home":ST.screen};SS.t=initTask(SS.q[0]);ST.screen="study";ST.tocOpen=false;render();bindPanel()}

 return `<div class="shyb whyb" style="--sf:${ST.shyf}px">${G.map(g=>shyBody(g,G.length>1)).join("")}<p class="shysrc">——${esc((WORKS[0].shiyi)||"释义")}</p></div>`}
function locHTML(t,T){const P=T.path,chosen=P.slice(0,T.lay),cur=T.done?null:P[T.lay];const base=P[0].lvl;
 const ob=c=>{const w=T.bad[c.id];return `<button class="lo ${w?"bad":""}" data-lo="${c.id}" ${w?"disabled":""} style="--lc:var(--k${c.depth})">${badge(c)}<span class="lt2">${esc(c.title)}</span>${w?`<em>${w}</em>`:""}</button>`};
 const opts=cur?`<div class="lopts">${cur.p.c.map(ob).join("")}</div>`:"";
 let mid;
 if(ST.locsty==="tree")mid=`<div class="ltree">${chosen.map((x,i)=>`<div class="lr ${i<T.auto?"auto":""}" style="--lc:var(--k${x.depth});margin-left:${(x.lvl-base)*10}px">${badge(x)}<span>${esc(x.title)}</span></div>`).join("")}${cur?`<div class="lnext" style="margin-left:${(cur.lvl-base)*10}px">${opts}</div>`:""}</div>`;
 else mid=`<div class="lpath">${chosen.map((x,i)=>`<span class="${i<T.auto?"auto":""}" style="--lc:var(--k${x.depth})"><b>${x.code}</b>${esc(x.title)}</span>`).join("<i>›</i>")}${cur?`${chosen.length?"<i>›</i>":""}<span class="lqm">？</span>`:""}</div>${opts}`;
 const res=T.done?`<div class="sres ${T.wrong?"no":"ok"}">${t.daily?(T.fail?"5 次机会用完了，答案在上面":`用了 ${5-T.chances} 次机会就找到了`):T.wrong?`中途选错过 ${T.wrong} 次，这题按答错记`:"一次选对"}</div>
  ${t.daily?"":`<details class="why"><summary>为什么归在「${esc(t.n.title)}」？先自己想一想</summary>${whyBody(t,T)}</details>`}`:"";
 return `<div class="lq"><div class="lql">${T.done?"":"这一颂在哪一科？"}${t.daily?"":`<span>${T.done?"":`从${P[T.auto].code[0]}开始，一层一层选`}</span>`}</div>${verseHTML(T.leaf.v)}</div>${mid}${res}`}
function expHTML(t,T){const n=t.n,B=t.B,R=!n.p;
 const head=`${R?"":chipsPath(anc(n).slice(-3))}<div class="eh" style="--lc:var(--k${n.depth||0})">${R?"":badge(n)}<b>${esc(R?B.title:n.title)}</b><span>分 <em>${n.c.length}</em> 支，依次是？${t.isNew?"<small>第一次学：只有正确的卡片</small>":T.dis.size?`<small>混了 ${T.dis.size} 张别处的卡片</small>`:""}</span></div>`;
 let mid;
 if(ST.expsty==="tree")mid=`<div class="etree" style="--lc:var(--k${n.depth||0})">${T.placed.map(id=>{const c=B.by[id];return `<div class="er" style="--lc:var(--k${c.depth})">${badge(c)}<span>${esc(c.title)}</span></div>`}).join("")}${T.done?"":`<div class="er next"><span class="en">${T.placed.length+1}</span><span>？</span></div>`}</div>`;
 else mid=`<div class="eslots">${n.c.map((c,i)=>{const p=T.placed[i];return `<div class="es ${p?"fill":""} ${!T.done&&i===T.placed.length?"next":""}" style="--lc:var(--k${c.depth})">${p?badge(c):`<span class="en">${i+1}</span>`}<span>${p?esc(c.title):""}</span></div>`}).join("")}</div>`;
 const cards=T.done?"":`<div class="ecards">${T.order.filter(id=>!T.placed.includes(id)).map(id=>`<button class="ec ${T.shake===id?"shake":""}" data-ec="${id}">${esc(B.by[id].title)}</button>`).join("")}</div>`;
 const res=T.done?`<div class="sres ${T.wrong?"no":"ok"}">${T.wrong?`点错过 ${T.wrong} 次，这题按答错记`:"顺序全对"}</div>`:"";
 return head+mid+cards+res}
function maskHTML(t,T){const n=t.n;const r=T.r;
 const v=r===0||T.done?verseHTML(n.v):verseMaskHTML(n.v,r).replace('class="verse vm"',`class="verse vm ${T.peek?"peek":""}" data-peek`);
 return `${chipsPath(anc(n).slice(-3))}<div class="eh" style="--lc:var(--k${n.depth})">${badge(n)}<b>${esc(n.title)}</b><span>下面的颂词，背出来</span></div>
  <div class="mv mb-${ST.mkb}" style="--mko:${ST.mko}%;--mkr:${ST.mkr}px;--mkg:${ST.mkg}px">${v}</div>

  ${T.done?`<div class="sres ${T.wrong?"no":"ok"}">${t.isNew?"四轮都过了":T.wrong?"中途模糊过，按答错记":"首字提示下记得"}</div>`:""}`}
function fbHTML(t){const last=SS.res[SS.res.length-1];if(!last||t.daily)return "";const n=t.n;
 const msg=!last.ok?`还不牢，过一会儿再出现`:last.first?`${SK[t.k]}这一段亮了${nstate(n).gold?"，整个节点变金":""}`:last.ok?`下次大约 ${INTV[last.lv]} 天后再来`:`还不牢，过一会儿再出现`;
 return `<div class="sfb">${ST.sfb==="ring"&&ST.ring!=="none"?ringHTML(n,"big",last.first?t.k:null):""}<div><b>${esc(n.p?n.code+" "+n.title:t.B.title)}</b><span>${msg}</span></div></div>`}
function taskHTML(t,T){const k=T.kind;const body=k==="loc"?locHTML(t,T):k==="exp"?expHTML(t,T):maskHTML(t,T);
 const last=SS.i===SS.q.length-1;
 const foot=T.done?`${fbHTML(t)}<div class="sacts">${ST.sview==="sheet"&&!t.daily?`<button data-jump>在原文里看看</button>`:""}<button class="pri" data-next>${t.daily?"回书架":last?"完成":"下一题"}</button></div>`
  :k==="mask"?`<div class="sacts"><button data-mj="fuzzy">模糊</button><button class="pri" data-mj="ok">${T.r===3?"记得 · 完成":"记得"}</button></div>`:"";
 return `<div class="tk tk-${k}"><div class="tkh"><span class="tkind ${t.isNew?"new":""} ${t.daily?"dly":""}">${t.daily?"每日一颂":(t.isNew?"新学":"复习")+" · "+SK[t.k]}</span><span class="tkb">${esc(shortT(t.B))}</span></div>${body}<div class="tkf">${foot}</div></div>`}
function extraQueue(){for(const B of Object.values(BOOKS)){const n=newNode(B)||newNodeAny(B);if(n){const miss=stepsOf(n).filter(k=>!itm(n,k));return ["exp","mask","loc"].filter(k=>miss.includes(k)).map(k=>({n,k,B,isNew:true}))}}return []}

function doneHTML(){const R=SS.res;if(R.length)SR.last=0;const rv=R.filter(x=>!x.t.isNew),nw=R.filter(x=>x.t.isNew);const seen=[];R.forEach(x=>{if(!seen.includes(x.t.n))seen.push(x.t.n)});
 if(!R.length)return `<div class="sdone"><div class="sdt">今天没有要复习的</div><p>新学的也都学完了。可以回去读一读，或者做每日一颂。</p>${moreBtn()}<div class="sacts"><button class="pri" data-sx>回书架</button></div></div>`;
 return `<div class="sdone"><div class="sdt">${SS.extra?"又学完一支":"今天的完成了"}</div><div class="sstat"><span><b>${rv.length}</b>条复习<small>答对 ${rv.filter(x=>x.ok).length}</small></span><span><b>${nw.length?1:0}</b>支新学<small>${nw.length?esc(nw[0].t.n.title):"—"}</small></span><span><b>${SR.streak}</b>天连续</span></div>
  <div class="slist">${seen.map(n=>`<div class="sli">${ringHTML(n)}${n.p?badge(n):""}<span>${esc(n.p?n.title:bookOf(n).title)}</span></div>`).join("")}</div>

function progHead(){const q=SS.q,i=SS.i,fin=i>=q.length;if(SS.daily){const c=SS.t?SS.t.chances:0;return `<span class="sttl">每日一颂</span><span class="spd chance">${[0,1,2,3,4].map(j=>`<i class="${j<c?"ok":"no"}"></i>`).join("")}</span>`}
 const p=ST.sprog==="bar"?`<span class="spb"><i style="width:${(Math.min(i+(SS.t&&SS.t.done?1:0),q.length)/q.length*100).toFixed(0)}%"></i></span>`:ST.sprog==="beads"?`<span class="spd">${q.map((_,j)=>{const r=SS.res.find(x=>x.t===q[j]);return `<i class="${j<i||(j===i&&SS.t&&SS.t.done)?(r&&!r.ok?"no":"ok"):j===i?"cur":""}"></i>`}).join("")}</span>`:`<span class="sttl">${fin?"完成":`第 ${i+1} 题 · 共 ${q.length} 题`}</span>`;

function renderStudy(){if(!SS){startSession();return}
 const fin=SS.i>=SS.q.length,t=fin?null:SS.q[SS.i],T=SS.t;
 const inner=fin?doneHTML():taskHTML(t,T);
 const head=`<div class="shd"><button class="sx" data-sx aria-label="结束">✕</button>${progHead()}</div>`;
 let root;
 if(ST.sview==="sheet"&&!fin){BK=t.B;ST.openAt=(t.k==="loc"?T.leaf:t.n).id;ST.view="toc";renderReader();const app=dev.querySelector(".app");app.classList.add("sv-sheet");if(!T.done)app.classList.add("sblur");
  const sh=document.createElement("div");sh.className="ssheet "+(T.done?"low":"");sh.innerHTML=head+`<div class="sbody">${inner}</div>`;app.appendChild(sh);root=sh;
  if(T.done){const row=app.querySelector(`.row[data-id="${(t.k==="loc"?T.leaf:fl(t.n)).id}"]`);if(row)row.classList.add("flash")}}
 else{dev.innerHTML=`<div class="app study sv-${ST.sview==="sheet"?"full":ST.sview}">${head}<div class="sbody">${ST.sview==="card"&&!fin?`<div class="sstack"><div class="scard ${!T.done&&SS.shownI!==SS.i?"in":""}">${inner}</div></div>`:inner}</div></div>`;root=dev;SS.shownI=SS.i}
 bindStudy(root,t,T);if(fin||(SS.daily&&T&&T.done))dediMaybe()}
function bindStudy(root,t,T){const rer=()=>{renderStudy()};
 root.querySelectorAll("[data-sx]").forEach(b=>b.onclick=exitSession);
 root.querySelectorAll("[data-smore]").forEach(b=>b.onclick=()=>{const q=extraQueue();if(!q.length)return;const from=SS&&SS.from||"home";SS={q,i:0,res:[],daily:false,from,extra:true};SS.t=initTask(q[0]);render();bindPanel()});
 root.querySelectorAll("[data-tree]").forEach(b=>b.onclick=()=>{SS=null;BK=BOOKS.p2;ST.view="map";ST.screen="reader";ST.tocOpen=!wide();mmReset(null);render();bindPanel()});
 const nx=root.querySelector("[data-next]");if(nx)nx.onclick=()=>{if(SS.daily){exitSession();return}SS.i++;SS.t=initTask(SS.q[SS.i]);rer()};
 const jp=root.querySelector("[data-jump]");if(jp)jp.onclick=()=>{const id=(t.k==="loc"?T.leaf:t.n).id;BK=t.B;SS=null;ST.screen="reader";ST.openAt=id;render();bindPanel()};
 if(!t||T.done)return;
 if(T.kind==="loc")root.querySelectorAll("[data-lo]").forEach(b=>b.onclick=()=>{const want=T.path[T.lay];const c=t.B.by[b.dataset.lo];
  if(c===want){T.lay++;while(T.lay<T.path.length&&T.path[T.lay].p.c.length===1)T.lay++;if(T.lay>=T.path.length){T.done=true;grade(t,!T.wrong)}T.bad={}}
  else{T.wrong++;const sib=want.p.c;T.bad[c.id]=sib.indexOf(c)<sib.indexOf(want)?"更后":"更前";if(T.chances!=null){T.chances--;if(T.chances<=0){T.fail=true;T.lay=T.path.length;T.done=true;grade(t,false)}}}
  rer()});
 if(T.kind==="exp")root.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>{const want=t.n.c[T.placed.length].id;T.shake=null;
  if(b.dataset.ec===want){T.placed.push(want);if(T.placed.length===t.n.c.length){T.done=true;grade(t,!T.wrong)}rer()}
  else{T.wrong++;T.shake=b.dataset.ec;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}});
 if(T.kind==="mask"){const v=root.querySelector("[data-peek]");if(v)v.onclick=()=>{T.peek=!T.peek;v.classList.toggle("peek",T.peek);const s=root.querySelector(".mdots span");if(s)s.textContent=`第 ${T.r+1} 轮 · ${RND[T.r]}`};
  root.querySelectorAll("[data-mj]").forEach(b=>b.onclick=()=>{T.peek=false;if(b.dataset.mj==="ok"){if(T.r>=3){T.done=true;grade(t,!T.wrong)}else T.r++}else{if(!t.isNew){T.wrong=true;if(T.r===3)T.r=2}}rer()})}}
