name = "kepan-push"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# 允许哪些网页来订阅（逗号分隔）
ALLOWED_ORIGINS = "https://jangchubgyaltsen.github.io"
# 运行 node keygen.mjs 后，把公钥填在这里
VAPID_PUBLIC = ""

[[d1_databases]]
binding = "DB"
database_name = "kepan-push"
# 运行 npx wrangler d1 create kepan-push 后，把它给出的 database_id 填在这里
database_id = ""
