name: 打包科判校对 exe

on:
  push:
    paths:
      - 'tools/proofread/**'
      - '.github/workflows/build-proofread-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/proofread
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 程序自检（造一份带错的小科判跑一遍）
        run: python selfcheck.py

      - name: 打包
        run: >
          pyinstaller --noconfirm --onefile --windowed --name kepan-jiaodui
          --collect-data opencc --collect-all pypdfium2 --collect-all pdfplumber
          app.py

      - name: exe 自检
        shell: pwsh
        run: |
          Start-Process -FilePath dist\kepan-jiaodui.exe -ArgumentList '--selftest' -Wait
          $r = Get-Content dist\selftest.txt -Raw -Encoding utf8
          Write-Output $r
          if ($r.Trim() -ne 'ok') { exit 1 }
          Remove-Item dist\selftest.txt
          Copy-Item 使用说明.txt dist\

      - name: 截使用图示（真实打开 exe，用演示文件跑一遍）
        shell: pwsh
        run: |
          python make_demo.py demo
          New-Item -ItemType Directory -Force shots | Out-Null
          $kp = (Resolve-Path 'demo\示例论 科判 1稿1.docx').Path
          $out = (Resolve-Path shots).Path
          Start-Process -FilePath dist\kepan-jiaodui.exe -ArgumentList '--demo', "`"$kp`"", "`"$out`"" -Wait
          Get-ChildItem shots
          Copy-Item 'demo\示例论 科判 1稿1 校对*.docx' shots\ -ErrorAction SilentlyContinue
          Copy-Item '..\..\docs\proofread-screenshots\3-word批注.png' shots\
          $env:PYTHONIOENCODING = "utf-8"
          python make_guide.py shots shots\使用图示.png
          Copy-Item shots\使用图示.png dist\
          Copy-Item 更新说明.txt dist\

      - name: 把截图存回分支
        shell: pwsh
        run: |
          $dst = '..\..\docs\proofread-screenshots'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item shots\* $dst -Force
          cd ..\..
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add docs/proofread-screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m '更新使用截图 [skip ci]'
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }

      - uses: actions/upload-artifact@v4
        with:
          name: kepan-jiaodui-windows
          path: |
            tools/proofread/dist/kepan-jiaodui.exe
            tools/proofread/dist/使用说明.txt
            tools/proofread/dist/使用图示.png
            tools/proofread/dist/更新说明.txt
